name: Bug report
description: Report incorrect detection, output, or exit codes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please do not paste real secret values.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: envxref reported X, but I expected Y.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        Minimal source snippet and `.env.example` that trigger the problem.
        Use placeholder values only — never real secrets.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: envxref version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v20.x
    validations:
      required: true
