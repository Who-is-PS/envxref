name: Feature request
description: Suggest a new detector, flag, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        envxref is intentionally small. Out of scope: AI, telemetry, accounts,
        cloud services, secret scanning, frameworks, web UI, and auto-fixing.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that envxref doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        For a new detector, include example syntax (e.g. `os.getenv("X")`) and
        the file extensions it applies to.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
